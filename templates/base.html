<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- GitHub Pages serves no headers of its own, so the policy travels in the
     page. `script-src 'self'` is the load-bearing part: this origin also serves
     /admin/, where the CMS keeps a GitHub token with write access to the repo,
     and a script planted in a post would be running right beside it. Nothing
     here is inline, so nothing needs 'unsafe-inline'.

     Images may come from anywhere over https, because a post is allowed to
     illustrate itself from another site and an image cannot execute. No
     `frame-ancestors` here: browsers ignore that one when it arrives in a
     meta tag, and a policy that claims a protection it does not deliver is
     worse than one that stays quiet about it. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>{{ page_title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<link rel="icon" href="{{ favicon_url }}" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="{{ site_title }}" href="{{ feed_url }}">
<link rel="stylesheet" href="{{ style_url }}">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="{{ og_type }}">
<meta property="og:site_name" content="{{ site_title }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ og_image }}">
<meta property="og:image:alt" content="{{ site_title }}">
<meta name="twitter:card" content="summary_large_image">
</head>
<body data-posts-url="{{ posts_url }}">
<a class="skip-link" href="#content">Skip to content</a>

<header class="site-header">
  <div class="masthead">
    <a class="site-title" href="{{ home_url }}">{{ site_title }}</a>
    <p class="tagline">{{ tagline }}</p>
  </div>
  <nav class="site-nav" aria-label="Site">
    <a href="{{ home_url }}">Home</a>
    <a href="{{ feed_url }}">RSS</a>
    <a href="{{ admin_url }}">Write</a>
  </nav>
</header>

<div class="shell">
  <main id="content" tabindex="-1">
{{ content | safe }}
  </main>

  <aside class="sidebar" aria-label="About this blog">
{{ sidebar | safe }}
  </aside>
</div>

<footer class="site-footer">
  <p>&copy; {{ year }} {{ author }}</p>
  <!-- The portfolio link is absolute on purpose: it leaves this site, so it is
       the one href in the chrome that must not go through Site.path(). -->
  <p><a href="{{ feed_url }}">RSS</a> &middot; <a href="{{ admin_url }}">Write a post</a>
     &middot; <a href="https://oscarjuji.github.io/" rel="me">Portfolio</a></p>
</footer>

<script src="{{ script_url }}" defer></script>
</body>
</html>
