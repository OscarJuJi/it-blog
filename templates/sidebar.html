  <section class="window widget">
    <div class="window-bar">
      <h2 class="window-title">Tags</h2>
      <span class="window-controls" aria-hidden="true"><b></b><b></b><b></b></span>
    </div>
    <div class="window-body">
      <ul class="tag-cloud">
{{ tag_cloud | safe }}
      </ul>
    </div>
  </section>

  <section class="window widget">
    <div class="window-bar">
      <h2 class="window-title">Recent entries</h2>
      <span class="window-controls" aria-hidden="true"><b></b><b></b><b></b></span>
    </div>
    <div class="window-body">
      <ul class="recent">
{{ recent_items | safe }}
      </ul>
    </div>
  </section>
