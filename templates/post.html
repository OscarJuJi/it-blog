<article class="window post">
  <div class="window-bar">
    <time class="window-title" datetime="{{ iso_date }}">{{ display_date }}</time>
    <span class="window-controls" aria-hidden="true"><b></b><b></b><b></b></span>
  </div>
  <div class="window-body">
    <header class="post-header">
      <span class="reading-time">{{ reading_time }} min read</span>
      <h1>{{ title }}</h1>
      {{ tags | safe }}
    </header>

{{ body | safe }}
  </div>
</article>

{{ related | safe }}

{{ post_nav | safe }}

<p class="back"><a href="{{ home_url }}">&larr; All posts</a></p>
