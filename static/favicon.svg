<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="IT Brief">
  <!-- Drawn to survive being 16px wide in a tab: one plate, one letter, no
       detail that would turn to mush. SVG rather than .ico so it stays sharp on
       a high-density screen and needs no build step. The palette is the oxide
       one from style.css, hardcoded because a stylesheet cannot reach in here. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4713f"/>
      <stop offset="0.5" stop-color="#a8431a"/>
      <stop offset="1" stop-color="#7d2f10"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="6" fill="url(#plate)"/>
  <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="#5a2109" stroke-width="1.5"/>
  <!-- The 2008 highlight: a sheen over the top half only. -->
  <path d="M2.5 7a4.5 4.5 0 0 1 4.5-4.5h18A4.5 4.5 0 0 1 29.5 7v7.5c-9 3-18 3-27 0Z" fill="url(#gloss)"/>
  <text x="16" y="23.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="21" font-weight="700" fill="#fdf3e4">B</text>
</svg>
