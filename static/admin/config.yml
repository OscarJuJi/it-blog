# Sveltia CMS. Saving here commits to the repository, which rebuilds the site.

backend:
  name: github
  repo: OscarJuJi/ti-blog
  branch: main

site_url: https://oscarjuji.github.io/ti-blog/
display_url: https://oscarjuji.github.io/ti-blog/

media_folder: static/images
public_folder: /ti-blog/images

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: content/posts
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date | date('YYYY-MM-DD')}} — {{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - {
          name: date,
          label: Date,
          widget: datetime,
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
        }
      - {
          name: description,
          label: Summary,
          widget: text,
          required: false,
          hint: One or two sentences, shown on the front page and in the feed.,
        }
      - { name: tags, label: Tags, widget: list, required: false }
      # Kept out of the build while ticked. `posts._flag` reads it, treating
      # only true/yes/on/1 as yes: the front matter parser has no types, so
      # `draft: false` arrives as a non-empty string and plain truthiness would
      # hide a post its author had marked ready.
      - {
          name: draft,
          label: Draft,
          widget: boolean,
          required: false,
          default: false,
          hint: Keep this out of the published site until unticked.,
        }
      # Raw only. The rich-text editor re-serialises whatever it loads, which is
      # how 2026-08-02 came back with _dev.to_ where the agent had written
      # *dev.to* -- a change no reader could see and every parser could trip on.
      # Editing the Markdown directly leaves the file as it was written.
      #
      # `modes` is documented for Decap's markdown widget, whose config Sveltia
      # reproduces; Sveltia's own docs page for the widget was not reachable, so
      # confirm the toolbar really opens in raw mode the next time you edit a post.
      - { name: body, label: Body, widget: markdown, modes: [raw] }
