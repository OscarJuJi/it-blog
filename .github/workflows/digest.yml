name: Digest

on:
  schedule:
    # 13:00 UTC is 07:00 in Mexico City, which does not observe DST.
    # Tuesday and Friday: 2 and 5 in cron's day-of-week, where Sunday is 0.
    - cron: "0 13 * * 2,5"
  workflow_dispatch:

jobs:
  write:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.commit.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write the digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m agent.run

      - name: Commit it
        id: commit
        run: |
          if [ -z "$(git status --porcelain content/posts)" ]; then
            echo "this edition is already published"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts
          git commit -m "Digest for $(date -u +%Y-%m-%d)"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

  # Deliberately a job of its own rather than a step in `write`. The agent
  # already degrades to a list of links instead of failing, which is why four
  # bad days went unnoticed in August -- so this has to be able to go red
  # without taking the deploy down with it.
  check:
    needs: write
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `write` may have just pushed. Checking out the caller's SHA would
          # inspect the tree from before that commit -- the same trap that made
          # the 2026-08-02 deploy publish nothing.
          ref: main

      - name: Look for digests that published without summaries
        id: look
        run: |
          read today previous is_edition_day < <(python3 - <<'PY'
          import datetime as dt, tomllib, zoneinfo
          # Tuesday and Friday, matching the cron above. Kept here rather than
          # hardcoded in the shell so the two definitions of "an edition day"
          # sit next to each other.
          EDITION_DAYS = {1, 4}
          with open("config.toml", "rb") as handle:
              name = tomllib.load(handle)["site"].get("timezone", "UTC")
          try:
              zone = zoneinfo.ZoneInfo(name)
          except Exception:
              zone = dt.timezone.utc
          today = dt.datetime.now(dt.timezone.utc).astimezone(zone).date()
          previous = today - dt.timedelta(days=1)
          while previous.weekday() not in EDITION_DAYS:
              previous -= dt.timedelta(days=1)
          print(today.isoformat(), previous.isoformat(), int(today.weekday() in EDITION_DAYS))
          PY
          )

          problems=""
          note() { problems="${problems}- $1"$'\n'; }

          # Both names are accepted on purpose: the digest was daily until
          # 2026-08-11 and the posts published then keep their filenames, so
          # during the changeover the previous edition may still be a daily one.
          inspect() {
            local day="$1" label="$2" post=""
            for candidate in "content/posts/$1-weekly-digest.md" "content/posts/$1-daily-digest.md"; do
              [ -f "$candidate" ] && post="$candidate" && break
            done
            if [ -z "$post" ]; then
              note "**$day** ($label): no digest exists. That day's run never published one."
            elif grep -q "summaries could not be generated" "$post"; then
              note "**$day** ($label): published as a list of links. Every one of the model's answers came back unusable."
            fi
          }

          # A manual run on a Wednesday should not report a missing Wednesday
          # edition -- there is not meant to be one.
          if [ "$is_edition_day" = "1" ]; then
            inspect "$today" "today"
          else
            echo "not an edition day; only checking the previous one"
          fi
          inspect "$previous" "the previous edition"

          if [ -n "$problems" ]; then
            echo "$problems"
          else
            echo "the recent digests carry summaries"
          fi

          {
            echo "problems<<PROBLEMS_EOF"
            printf '%s' "$problems"
            echo
            echo "PROBLEMS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Say so, loudly
        if: steps.look.outputs.problems != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBLEMS: ${{ steps.look.outputs.problems }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Digest published without summaries"
          body="$PROBLEMS
          The agent falls back to a list of links when the model's answer cannot be
          used, and it does that quietly -- the run still goes green. Check the
          \`Write the digest\` step of [this run]($RUN_URL) for the reason. Look for
          \`attempt N of 3 came back unusable\`, \`generation stopped early\`, or
          \`the answer arrived truncated\`.

          Regenerating a *past* edition with \`--force\` is not a repair: the feed
          window is 96 hours, so it would file this week's stories under that date."

          # One running issue rather than a new one every edition.
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

          echo "::error::$title"
          exit 1

  deploy:
    needs: write
    if: needs.write.outputs.published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-deploy.yml
