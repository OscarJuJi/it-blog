name: Repair posts

# Run by hand only. This edits posts that are already published, so it defaults
# to a dry run and you have to ask for the write explicitly.
on:
  workflow_dispatch:
    inputs:
      retag:
        description: Give old digests real topics
        type: boolean
        default: true
      refill:
        description: Summarise the links-only digests from the articles they link to
        type: boolean
        default: false
      apply:
        description: Actually write and commit (leave off for a dry run)
        type: boolean
        default: false

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Repair
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          args=""
          [ "${{ inputs.retag }}" = "true" ] && args="$args --retag"
          [ "${{ inputs.refill }}" = "true" ] && args="$args --refill"
          [ "${{ inputs.apply }}" = "true" ] || args="$args --dry-run"
          [ -n "$args" ] || { echo "nothing selected"; exit 1; }
          python scripts/repair_posts.py $args

      - name: Show the diff
        run: git --no-pager diff --stat

      - name: Commit
        id: commit
        if: ${{ inputs.apply }}
        run: |
          if [ -z "$(git status --porcelain content/posts)" ]; then
            echo "nothing changed"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts
          git commit -m "Repair published digests

          Retagged and/or refilled by scripts/repair_posts.py. Summaries come
          from the articles each post already linked to, not from a fresh feed
          read: the collection window is 26 hours, so re-running the feeds for
          an old date would file today's news under it."
          git push

  # A push made with GITHUB_TOKEN does not trigger `on: push`, so the site would
  # keep serving the unrepaired posts until something else happened to deploy.
  # The daily digest calls the deploy for the same reason; this had to as well,
  # and the first run of it published nothing.
  deploy:
    needs: repair
    if: needs.repair.outputs.committed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-deploy.yml
