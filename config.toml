# Configuration shared by the static site generator and the digest agent.

[site]
title = "IT Brief"
tagline = "What mattered in tech, twice a week, plus notes of my own."
description = "The week's IT news in two digests, curated automatically, plus posts by Oscar Juarez."
author = "Oscar Juarez"
# Origin of the deployed site, without a trailing slash.
url = "https://oscarjuji.github.io"
# Path prefix. This is a GitHub Pages *project* site, so every internal link
# needs it. Use "" for a user site served from the root.
base_url = "/it-blog"
language = "en"
# Decides which calendar day a digest belongs to, and how dates are displayed.
timezone = "America/Mexico_City"

[agent]
# Model used to write the digest. See https://ai.google.dev/gemini-api/docs/quickstart
model = "gemini-3.6-flash"
# Only entries published within this many hours of the run are considered. The
# digest goes out Tuesday and Friday, so the longer gap to cover is Friday to
# Tuesday: four days, plus a few hours so a late run never leaves a hole.
window_hours = 96
# At most this many entries survive from a single feed...
#
# These two rose with the window, and had to. `rank.select` sorts by recency
# alone, so over four days a feed's six slots would have filled with yesterday's
# six items and nothing from days three and four would ever reach the model --
# "best of the week" would have quietly meant "best of yesterday".
per_feed_limit = 12
# ...and at most this many candidates are handed to the model.
#
# This one sizes the prompt directly: at 40 it measures ~94,000 characters,
# about 23,500 tokens. Raise it and check `llm.OLLAMA_CONTEXT` still leaves room
# for an answer on top, or the local backend goes back to reading a fragment of
# its instructions and replying in prose. A test pins the relationship.
candidate_limit = 40
# Bounds on how many stories the digest covers. Fewer than the daily edition
# carried, because each one is now several paragraphs rather than a sentence.
min_stories = 5
max_stories = 7
# The tags a digest may carry, beyond the "digest" marker every one of them has.
# Deliberately a closed list: left to invent its own, the model coins a near
# synonym most days, and a tag that appears once is a tag nobody can browse by.
# When the log starts reporting the same rejected topic over and over, that is
# the signal to add it here -- one line, no code change.
# Keep every entry lowercase and free of ':' '[' ']' '#' ',' quotes and newlines:
# the front matter is written by hand and has no escapes. A test enforces this.
topics = [
  "ai",
  "security",
  "web",
  "devtools",
  "databases",
  "cloud",
  "hardware",
  "mobile",
  "open-source",
  "programming-languages",
  "performance",
  "networking",
  "data",
  "policy",
  "business",
  "science",
]
# At most this many topics on one post, on top of the marker.
max_topics = 3
# How far back to look for stories already covered, so a big item does not run
# two mornings in a row. Two weeks: past that, a story resurfacing is usually
# genuine new coverage rather than an echo.
memory_days = 14

[[agent.feeds]]
name = "Hacker News"
url = "https://hnrss.org/frontpage"

[[agent.feeds]]
name = "Ars Technica"
url = "https://feeds.arstechnica.com/arstechnica/index"

[[agent.feeds]]
name = "The Verge"
url = "https://www.theverge.com/rss/index.xml"

[[agent.feeds]]
name = "TechCrunch"
url = "https://techcrunch.com/feed/"

[[agent.feeds]]
name = "dev.to"
url = "https://dev.to/feed"

[[agent.feeds]]
name = "InfoQ"
url = "https://feed.infoq.com/"
